name: MandiGuard Revision v6 CI

on:
  push:
    branches: [finalization]
  pull_request:
    branches: [main, finalization]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History tests read the pre-registration commits. The default
          # depth of 1 makes every file look like it was added in the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements.txt
      - name: Run full leak-free rebuild & evaluation
        run: |
          bash .github/scripts/run_py.sh "Generated rev_fig1..4" python -m revision.build_run
      - name: Run independent audit & traceability verification
        run: |
          bash .github/scripts/run_py.sh "A16 INDEPENDENT AUDIT PASSED" python scripts/a16_independent_audit.py
          bash .github/scripts/run_py.sh "TRACEABILITY CHECK PASSED" python scripts/verify_traceability.py
      - name: Run pytest (including R3 counterfactual leakage tests)
        run: |
          bash .github/scripts/run_py.sh "__junit__" python -m pytest -v --junitxml=pytest-report.xml
